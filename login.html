 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Peter Top Up</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #151e35;
      padding: 30px;
      border-radius: 16px;
    }
    h1 { text-align: center; color: #38bdf8; }
    input, button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }
    input { background: #26344f; color: white; }
    button {
      background: #38bdf8;
      font-weight: bold;
      cursor: pointer;
    }
    #message { text-align: center; color: #38bdf8; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome Back</h1>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email Address" required>
      <input type="password" id="password" placeholder="Password" required>
      <button id="loginBtn" type="submit">Login</button>
    </form>
    <p id="message"></p>
    <p>Don't have an account? <a href="signup.html">Create Account</a></p>
  </div>

  <script>
    const SUPABASE_URL = "https://hfehedbezwhftqzsfpwf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_EXOjvRcjrm0Jlp76bG5lVA_9HaHERpB";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginBtn");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      button.disabled = true;
      message.textContent = "Logging in...";

      try {
        const { data, error } = await client.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) throw error;

        message.textContent = "Login successful!";

        window.location.href = "dashboard.html";

      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
