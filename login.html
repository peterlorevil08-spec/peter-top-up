
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Peter Top Up</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(ellipse at top, #153c68, transparent 65%),
    #080d1b;
}

.card {
  width: 100%;
  max-width: 430px;
  padding: 35px 28px;
  background: #111c32;
  border: 1px solid #294365;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

.logo {
  text-align: center;
  font-size: 25px;
  font-weight: 900;
  color: #38bdf8;
  margin-bottom: 8px;
}

.logo span { color: #fbbf24; }

.tag {
  text-align: center;
  color: #94a3b8;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 28px;
}

h1 {
  text-align: center;
  font-size: 27px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #94a3b8;
  font-size: 14px;
  margin-bottom: 25px;
}

label {
  display: block;
  color: #cbd5e1;
  font-size: 13px;
  margin: 15px 0 7px;
}

input {
  width: 100%;
  padding: 15px;
  background: #1c2b45;
  color: white;
  border: 1px solid #344966;
  border-radius: 9px;
  outline: none;
  font-size: 15px;
}

input:focus {
  border-color: #38bdf8;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 22px;
  border: none;
  border-radius: 9px;
  background: linear-gradient(135deg,#38bdf8,#2563eb);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#message {
  text-align: center;
  min-height: 22px;
  color: #38bdf8;
  font-size: 14px;
  margin-top: 15px;
  overflow-wrap: anywhere;
}

.register {
  text-align: center;
  color: #aabbd2;
  font-size: 14px;
  margin-top: 22px;
}

a { color: #38bdf8; text-decoration: none; }

.back {
  display: block;
  text-align: center;
  margin-top: 22px;
  color: #94a3b8;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">PETER <span>TOP UP</span></div>
  <div class="tag">WELCOME BACK</div>

  <h1>Login to Your Account</h1>
  <p class="subtitle">Access your dashboard and orders.</p>

  <form id="loginForm">

    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <button id="loginBtn" type="submit">LOGIN →</button>

  </form>

  <p id="message" role="status"></p>

  <p class="register">
    Don't have an account?
    <a href="signup.html">Create Account</a>
  </p>

  <a class="back" href="index.html">← Back to Home</a>

</div>

<script>
const SUPABASE_URL = "https://hfehedbezwhftqzsfpwf.supabase.co";
const SUPABASE_KEY = "sb_publishable_EXOjvRcjrm0Jlp76bG5lVA_9HaHERpB";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginBtn");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  button.disabled = true;
  message.textContent = "Logging in...";

  try {
    const { data, error } = await client.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    if (error) throw error;

    message.textContent = "Login successful!";
    window.location.href = "dashboard.html";

  } catch (error) {
    message.textContent = error.message;
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>
