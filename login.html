
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Peter Top Up</title>
<style>
body{margin:0;background:#080610;color:white;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.box{background:#171020;border:1px solid #8134bb;padding:30px 22px;border-radius:15px;width:100%;max-width:380px}
h1{text-align:center;color:#bd75ff}
p{text-align:center;color:#c5b8d2}
input{width:100%;padding:13px;margin:9px 0;border:1px solid #66319a;border-radius:8px;background:#080610;color:white;font-size:15px;box-sizing:border-box}
button{width:100%;padding:13px;background:#922eff;color:white;border:0;border-radius:8px;margin-top:12px;font-size:16px}
a{color:#bd75ff}
</style>
</head>
<body>
<div class="box">
<h1>PETER TOP UP</h1>
<p>Welcome back!</p>
<form id="loginForm">
<input type="email" placeholder="Email Address" required>
<input type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
<a href="index.html">Back to Home</a>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit",function(e){
e.preventDefault();
alert("Login is not connected yet. Please check back soon.");
});
</script>
</body>
</html>
