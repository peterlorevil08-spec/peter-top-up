
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Peter Top Up</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #070b18, #101b35, #07111f);
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 35px 28px;
      background: #121d35;
      border: 1px solid #263b60;
      border-radius: 20px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.4);
    }

    .logo {
      text-align: center;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .logo span {
      color: #fbbf24;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin: 18px 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #344765;
      border-radius: 10px;
      outline: none;
      background: #1e2c47;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56,189,248,0.12);
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 24px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #0ea5e9, #38bdf8);
      color: #07111f;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 20px rgba(56,189,248,0.2);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    #message {
      text-align: center;
      color: #38bdf8;
      font-size: 14px;
      overflow-wrap: anywhere;
      margin-top: 18px;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      color: #94a3b8;
      font-size: 14px;
      line-height: 2;
    }

    a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      color: #fbbf24;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">PETER <span>TOP UP</span></div>

    <h1>Create Account</h1>
    <p class="subtitle">Join Peter Top Up and get started!</p>

    <form id="signupForm">

      <label for="fullName">Full Name</label>
      <input
        id="fullName"
        type="text"
        placeholder="Enter your full name"
        autocomplete="name"
        required
      >

      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Minimum 6 characters"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <button id="submitBtn" type="submit">
        Create Account
      </button>

    </form>

    <p id="message" role="status"></p>

    <div class="links">
      Already have an account?
      <a href="login.html">Login</a>
      <br>
      <a href="index.html">← Back to Home</a>
    </div>

    <div class="footer">
      © 2026 Peter Top Up. All rights reserved.
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://hfehedbezwhftqzsfpwf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_EXOjvRcjrm0Jlp76bG5lVA_9HaHERpB";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitBtn");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      message.textContent = "Creating account...";

      try {
        const { data, error } = await client.auth.signUp({
          email,
          password,
          options: {
            data: { full_name: fullName }
          }
        });

        if (error) throw error;

        if (data.user && data.session) {
          const { error: profileError } = await client
            .from("profiles")
            .upsert({
              id: data.user.id,
              full_name: fullName,
              email: email
            });

          if (profileError) throw profileError;
        }

        message.textContent = data.session
          ? "Account created successfully! You can now login."
          : "Account created. Please check your account settings.";

        form.reset();

      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>

</body>
</html>
