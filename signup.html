 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Peter Top Up</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #151e35;
      padding: 30px;
      border-radius: 16px;
    }
    h1 { color: #38bdf8; text-align: center; }
    input, button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    input { background: #26344f; color: white; }
    button {
      background: #38bdf8;
      color: #07111f;
      font-weight: bold;
      cursor: pointer;
    }
    #message { text-align: center; color: #38bdf8; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create Account</h1>
    <form id="signupForm">
      <input id="fullName" type="text" placeholder="Full Name" required>
      <input id="email" type="email" placeholder="Email Address" required>
      <input id="password" type="password" placeholder="Password (minimum 6 characters)" minlength="6" required>
      <button id="submitBtn" type="submit">Create Account</button>
    </form>
    <p id="message"></p>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script>
    const SUPABASE_URL = "https://hfehedbezwhftqzsfpwf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_EXOjvRcjrm0Jlp76bG5lVA_9HaHERpB";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitBtn");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      message.textContent = "Creating account...";

      try {
        const { data, error } = await client.auth.signUp({
          email,
          password,
          options: {
            data: { full_name: fullName }
          }
        });

        if (error) throw error;

        if (data.user && data.session) {
          const { error: profileError } = await client
            .from("profiles")
            .upsert({
              id: data.user.id,
              full_name: fullName,
              email: email
            });

          if (profileError) throw profileError;
        }

        message.textContent = data.session
          ? "Account created successfully! You can now login."
          : "Account created. Please check your account settings.";

        form.reset();

      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
