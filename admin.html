
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peter Top Up - Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px;
  background:linear-gradient(135deg,#070b18,#101b35,#07111f);
  color:white;
  font-family:Arial,sans-serif;
}

header{
  max-width:1100px;
  margin:0 auto 25px;
  padding:18px 22px;
  background:#121d35;
  border:1px solid #263b60;
  border-radius:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  color:#38bdf8;
  font-size:23px;
  font-weight:900;
}

.logo span{color:#fbbf24}

main{
  max-width:1100px;
  margin:auto;
}

.card{
  background:#121d35;
  border:1px solid #263b60;
  padding:22px;
  border-radius:15px;
  margin-bottom:20px;
}

h1,h2{color:#38bdf8}

h1{font-size:21px;margin:0}
h2{margin-top:0;font-size:21px}

p{
  color:#cbd5e1;
  line-height:1.6;
  overflow-wrap:anywhere;
}

button{
  padding:12px 16px;
  margin:5px 5px 5px 0;
  border:0;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
}

button:hover{transform:translateY(-2px)}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
}

.logout{
  background:#dc3545;
  color:white;
}

.verify{
  background:#38bdf8;
  color:#07111f;
}

.deliver{
  background:#22c55e;
  color:#052e16;
}

.order{
  background:#0b1428;
  border:1px solid #263b60;
  border-radius:12px;
  padding:18px;
  margin:15px 0;
}

.order-title{
  color:#fbbf24;
  font-weight:bold;
  font-size:17px;
}

.status{
  color:#38bdf8;
  font-weight:bold;
}

.time{
  color:#94a3b8;
  font-size:13px;
}

.customer{
  color:#94a3b8;
  font-size:12px;
  overflow-wrap:anywhere;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

.actions button{margin:0}

#orders{
  overflow-wrap:anywhere;
}

@media(max-width:500px){
  body{padding:12px}
  header{padding:15px}
  .logo{font-size:19px}
  .card{padding:17px}
  .actions{flex-direction:column}
  .actions button{width:100%}
}
</style>
</head>

<body>

<header>
  <div class="logo">PETER <span>TOP UP</span></div>
  <button class="logout" id="logout">Logout</button>
</header>

<main>

  <div class="card">
    <h1>ADMIN DASHBOARD</h1>
    <p>Manage customer orders, verify payments and confirm deliveries.</p>
  </div>

  <div class="card">
    <h2>All Customer Orders</h2>
    <div id="orders">Loading orders...</div>
  </div>

</main>

<script>
const SUPABASE_URL =
  "https://hfehedbezwhftqzsfpwf.supabase.co".trim();

const SUPABASE_KEY =
  "sb_publishable_EXOjvRcjrm0Jlp76bG5lVA_9HaHERpB".trim();

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function formatDate(date){
  return date ? new Date(date).toLocaleString() : "Not recorded";
}

async function start(){
  const {data:authData,error:authError} =
    await db.auth.getUser();

  if(authError || !authData.user){
    location.href = "login.html";
    return;
  }

  const {data:profile,error:profileError} = await db
    .from("profiles")
    .select("role")
    .eq("id",authData.user.id)
    .maybeSingle();

  if(profileError){
    document.getElementById("orders").textContent =
      "Profile error: " + profileError.message;
    return;
  }

  if(!profile){
    document.getElementById("orders").textContent =
      "No admin profile found.";
    return;
  }

  if(String(profile.role).trim().toLowerCase() !== "admin"){
    document.getElementById("orders").textContent =
      "Access denied.";
    return;
  }

  await loadOrders();
}

async function loadOrders(){
  const box = document.getElementById("orders");
  box.textContent = "Loading orders...";

  const {data,error} = await db
    .from("orders")
    .select("id,user_id,player_id,payment_method,amount_htg,payment_status,delivery_status,transaction_number,created_at,delivered_at,verified_at")
    .order("created_at",{ascending:false});

  if(error){
    box.textContent = "Error: " + error.message;
    return;
  }

  box.replaceChildren();

  if(!data || data.length === 0){
    box.textContent = "No orders found.";
    return;
  }

  data.forEach(order => {
    const item = document.createElement("div");
    item.className = "order";

    const title = document.createElement("p");
    title.className = "order-title";
    title.textContent =
      "ORDER #" + String(order.id).slice(0,8).toUpperCase();

    const details = document.createElement("p");
    details.textContent =
      "Player ID: " + order.player_id +
      " | Amount: " +
      Number(order.amount_htg).toLocaleString() + " HTG";

    const payment = document.createElement("p");
    payment.textContent =
      "Method: " + order.payment_method +
      " | Transaction: " +
      (order.transaction_number || "None");

    const status = document.createElement("p");
    status.className = "status";
    status.textContent =
      "Payment: " + order.payment_status +
      " | Delivery: " + order.delivery_status;

    const placed = document.createElement("p");
    placed.className = "time";
    placed.textContent =
      "Payment Placed: " + formatDate(order.created_at);

    const verified = document.createElement("p");
    verified.className = "time";
    verified.textContent =
      "Payment Verified: " + formatDate(order.verified_at);

    const deliveredTime = document.createElement("p");
    deliveredTime.className = "time";
    deliveredTime.textContent =
      "Payment Delivered: " + formatDate(order.delivered_at);

    const user = document.createElement("p");
    user.className = "customer";
    user.textContent = "Customer ID: " + order.user_id;

    const verify = document.createElement("button");
    verify.className = "verify";
    verify.textContent =
      order.payment_status === "Verified"
        ? "Payment Verified"
        : "Confirm Payment";

    verify.disabled = order.payment_status === "Verified";

    verify.onclick = () => updateOrder(order.id,{
      payment_status:"Verified",
      verified_at:new Date().toISOString()
    });

    const deliver = document.createElement("button");
    deliver.className = "deliver";
    deliver.textContent =
      order.delivery_status === "Delivered"
        ? "Delivered"
        : "Mark Delivered";

    deliver.disabled = order.delivery_status === "Delivered";

    deliver.onclick = () => {
      if(order.payment_status !== "Verified"){
        alert("Please verify the payment before marking this order as delivered.");
        return;
      }

      updateOrder(order.id,{
        delivery_status:"Delivered",
        delivered_at:new Date().toISOString()
      });
    };

    const actions = document.createElement("div");
    actions.className = "actions";
    actions.append(verify,deliver);

    item.append(
      title,
      details,
      payment,
      status,
      placed,
      verified,
      deliveredTime,
      user,
      actions
    );

    box.appendChild(item);
  });
}

async function updateOrder(id,changes){
  const {error} = await db
    .from("orders")
    .update(changes)
    .eq("id",id);

  if(error){
    alert("Update failed: " + error.message);
    return;
  }

  alert("Order updated successfully!");
  await loadOrders();
}

document.getElementById("logout").onclick = async () => {
  await db.auth.signOut();
  location.href = "login.html";
};

start();
</script>

</body>
</html>
