
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peter Top Up - Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{background:#151e35;padding:22px;display:flex;justify-content:space-between;align-items:center}
h1{color:#38bdf8;margin:0;font-size:22px}
main{max-width:850px;margin:35px auto;padding:20px}
.card{background:#151e35;padding:24px;border-radius:14px;margin-bottom:20px}
h2{color:#38bdf8}
p{color:#cbd5e1}
button{background:#38bdf8;color:#07111f;border:0;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
.logout{background:#ef4444;color:white}
</style>
</head>
<body>
<header>
<h1>PETER TOP UP</h1>
<button class="logout" id="logoutBtn">Logout</button>
</header>

<main>
<div class="card">
<h2>Welcome, <span id="customerName">Customer</span>!</h2>
<p>Your personal account dashboard.</p>
<p>Email: <span id="customerEmail">Loading...</span></p>
</div>

<div class="card">
<h2>Available Services</h2>
<p>Mobile Top Up</p>
<p>Digital Services</p>
<p>Game Top Up</p>
<p>More services coming soon.</p>
</div>

<div class="card">
<h2>Payment Proof</h2>
<p>Payment submission will be available soon.</p>
</div>

<div class="card">
<h2>Transaction History</h2>
<p>Your transactions will appear here.</p>
</div>
</main>

<script>
const SUPABASE_URL = "https://hfehedbezwhftqzsfpwf.supabase.co";
const SUPABASE_KEY = "sb_publishable_EXOjvRcjrm0Jlp76bG5lVA_9HaHERpB";

const client = window.supabase.createClient(
SUPABASE_URL, SUPABASE_KEY
);

async function loadDashboard(){
const {data:{user},error} = await client.auth.getUser();

if(error || !user){
window.location.href="login.html";
return;
}

document.getElementById("customerEmail").textContent=user.email;

const {data:profile} = await client
.from("profiles")
.select("full_name")
.eq("id",user.id)
.maybeSingle();

if(profile && profile.full_name){
document.getElementById("customerName").textContent=profile.full_name;
}
}

document.getElementById("logoutBtn").addEventListener("click",async()=>{
await client.auth.signOut();
window.location.href="login.html";
});

loadDashboard();
</script>
</body>
</html>
